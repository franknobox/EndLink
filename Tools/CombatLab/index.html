<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EndLink Combat Lab</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="workbench">
        <aside class="side-panel">
          <header class="panel-header">
            <span class="panel-kicker">DATA</span>
            <h2>TAG DEFINITIONS</h2>
          </header>
          <div class="panel-section tag-definition-section">
            <form id="tagDefinitionForm" class="compact-form">
              <div class="definition-grid">
                <label>
                  ID
                  <input id="tagDefinitionId" type="text" placeholder="ovl">
                </label>
                <label>
                  显示名
                  <input id="tagDefinitionName" type="text" placeholder="超频">
                </label>
                <label>
                  等级
                  <input id="tagDefinitionLevel" type="number" min="1" value="1">
                </label>
                <label>
                  默认时间
                  <input id="tagDefinitionDuration" type="number" min="0" step="0.1" value="6">
                </label>
                <label>
                  最大层数
                  <input id="tagDefinitionMaxStack" type="number" min="1" value="3">
                </label>
              </div>
              <button type="submit">保存 Tag</button>
            </form>
            <div id="tagDefinitionList" class="definition-list"></div>
          </div>

          <header class="panel-header panel-header-secondary">
            <span class="panel-kicker">RULE</span>
            <h2>REACTION RULES</h2>
          </header>
          <div class="panel-section rule-section">
            <form id="ruleForm" class="compact-form">
              <div class="rule-grid">
                <label>
                  Tag A
                  <input id="ruleFirstTag" type="text" placeholder="ovl">
                </label>
                <label>
                  A 层数
                  <input id="ruleFirstStack" type="number" min="1" value="1">
                </label>
                <label>
                  Tag B
                  <input id="ruleSecondTag" type="text" placeholder="ovl">
                </label>
                <label>
                  B 层数
                  <input id="ruleSecondStack" type="number" min="1" value="1">
                </label>
                <label>
                  优先级
                  <input id="rulePriority" type="number" value="0">
                </label>
              </div>
              <label>
                Effects
                <textarea id="ruleEffects" rows="3" placeholder="ApplyTag:meltdown; DealDamage:35:RuntimeDamage; RemoveTag:ovl"></textarea>
              </label>
              <button type="submit">添加规则</button>
            </form>
            <div id="rulesList" class="rules-list"></div>
          </div>
        </aside>

        <section class="center-panel">
          <header class="lab-title">
            <span>ENDLINK</span>
            <h1>COMBAT LAB</h1>
            <small>Protocol reaction simulator</small>
          </header>
          <section class="target-zone">
            <div class="target-orb">
              <span id="targetHpText">100 / 100</span>
            </div>

            <div class="target-data">
              <div class="target-header">
                <h2 id="targetNameLabel">Enemy Dummy</h2>
                <button type="button" id="resetButton">重置状态</button>
              </div>
              <div class="hp-bar">
                <div id="targetHpFill" class="hp-fill"></div>
              </div>
              <div class="target-fields">
                <label>
                  最大血量
                  <input id="targetMaxHealth" type="number" min="1" value="100">
                </label>
                <label>
                  当前血量
                  <input id="targetCurrentHealth" type="number" min="0" value="100">
                </label>
              </div>
              <div class="target-tags">
                <div class="section-title">TARGET TAGS</div>
                <div id="targetTags" class="tag-list"></div>
                <form id="tagForm" class="inline-form">
                  <input id="tagInput" type="text" placeholder="ovl:3">
                  <button type="submit">添加</button>
                </form>
              </div>
            </div>
          </section>

          <section id="characterBoard" class="character-board"></section>
        </section>

        <aside class="side-panel">
          <header class="panel-header">
            <span class="panel-kicker">LINK</span>
            <h2>LINK WINDOW</h2>
          </header>
          <div id="linkStatus" class="link-status">Closed</div>
          <header class="panel-header panel-header-secondary">
            <span class="panel-kicker">LOG</span>
            <h2>TIMELINE</h2>
          </header>
          <ol id="timeline" class="timeline"></ol>
        </aside>
      </section>
    </main>

    <template id="characterTemplate">
      <article class="actor-row">
        <input class="character-name" type="text" aria-label="角色名">
        <label class="actor-attack">
          Atk
          <input class="actor-atk" type="number" min="0" step="1">
        </label>
        <div class="action-line">
          <span>Skill</span>
          <input class="skill-flat" type="number" min="0" aria-label="Skill 固定伤害">
          <input class="skill-multiplier" type="number" min="0" step="0.1" aria-label="Skill 攻击力倍率">
          <select class="skill-damage-type" aria-label="Skill 伤害类型">
            <option value="StructuralDamage">SD</option>
            <option value="RuntimeDamage">RD</option>
          </select>
          <input class="skill-tags" type="text" aria-label="Skill Tag" placeholder="ovl:2">
          <button type="button" class="skill-button">释放</button>
        </div>
        <div class="action-line">
          <span>Link</span>
          <input class="link-flat" type="number" min="0" aria-label="Link 固定伤害">
          <input class="link-multiplier" type="number" min="0" step="0.1" aria-label="Link 攻击力倍率">
          <select class="link-damage-type" aria-label="Link 伤害类型">
            <option value="StructuralDamage">SD</option>
            <option value="RuntimeDamage">RD</option>
          </select>
          <input class="link-tags" type="text" aria-label="Link Tag" placeholder="nos">
          <button type="button" class="link-button">释放</button>
        </div>
      </article>
    </template>

    <script src="reaction-engine.js"></script>
    <script src="app.js"></script>
  </body>
</html>
